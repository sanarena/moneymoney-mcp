[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moneymoney-mcp"
version = "0.4.0"
description = "Read-only MCP server for MoneyMoney (macOS banking app) via AppleScript"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "moneymoney-mcp contributors" }]
keywords = ["moneymoney", "mcp", "banking", "finance", "applescript"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
moneymoney-mcp = "moneymoney_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sanarena/moneymoney-mcp"
Issues = "https://github.com/sanarena/moneymoney-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/moneymoney_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
